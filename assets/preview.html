<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor — preview</title>
<style>
    /* 市集预览图：1024x768，由 scripts/render-preview.mjs 用 Playwright 截图。
       只做抽象构图，不表现任何具体功能界面。

       思源把这张图放进 .item__preview（width:100%、height:50%、background-size:cover），
       容器的宽高比跟着窗口走，图片会被等比裁掉一圈。容器比 4:3 扁就裁上下，比 4:3 方
       就裁左右，所以构图必须落进「裁切安全区」，否则边缘的字会被切掉一半。
       本图按容器宽高比 0.45 到 1.1 估算，安全区约为 x∈[160,864]、y∈[154,614]。
       于是整组内容垂直居中在 y=384（图片中线，cover 的裁切左右上下都对称），
       深色块取 672x384，四边留出的余量足够吸收最坏情况的裁切。 */
    body {
        width: 1024px;
        height: 768px;
        margin: 0;
        overflow: hidden;
        background-color: #3575f0;
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    .stage {
        position: relative;
        width: 1024px;
        height: 768px;
    }

    .stage > svg {
        position: absolute;
        inset: 0;
        display: block;
    }

    /* 与深色代码块共用同一条左对齐轴（x = 176）。 */
    .wordmark {
        position: absolute;
        left: 176px;
        top: 574px;
        color: #ffffff;
        font-size: 32px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
    }
</style>
</head>
<body>
<div class="stage">
    <svg width="1024" height="768" viewBox="0 0 1024 768" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!--
          蓝色的底是思源主题主色；深色的那一块就是代码块本身，底色用的是思源暗色默认
          代码主题 github-dark 的真实值 #0d1117。下面每根色条的颜色也都取自那个主题的
          真实 token：关键字 #ff7b72、字符串 #a5d6ff、函数 #d2a8ff、类型 #79c0ff、
          名字 #7ee787、注释 #8b949e。这张图要说的就是：配色不是插件定的，是跟随用户设置的。
        -->
        <rect x="176" y="162" width="672" height="384" fill="#0d1117"/>

        <!-- 正在编辑的那一行，用一层极淡的底色标出来 -->
        <rect x="176" y="357" width="672" height="32" fill="#ffffff" fill-opacity="0.07"/>

        <!-- 其余各行。只表示「这里有代码、它是有颜色的」，不表示任何语法 -->
        <g>
            <rect x="220" y="214" width="76" height="14" fill="#ff7b72"/>
            <rect x="304" y="214" width="190" height="14" fill="#a5d6ff"/>
            <rect x="502" y="214" width="150" height="14" fill="#8b949e"/>

            <rect x="220" y="252" width="290" height="14" fill="#8b949e"/>

            <rect x="220" y="290" width="60" height="14" fill="#ff7b72"/>
            <rect x="288" y="290" width="220" height="14" fill="#a5d6ff"/>
            <rect x="516" y="290" width="130" height="14" fill="#79c0ff"/>

            <rect x="220" y="328" width="130" height="14" fill="#d2a8ff"/>
            <rect x="358" y="328" width="90" height="14" fill="#7ee787"/>
            <rect x="456" y="328" width="290" height="14" fill="#a5d6ff"/>

            <rect x="220" y="404" width="230" height="14" fill="#a5d6ff"/>
            <rect x="458" y="404" width="56" height="14" fill="#ff7b72"/>

            <rect x="220" y="442" width="170" height="14" fill="#7ee787"/>
            <rect x="398" y="442" width="210" height="14" fill="#8b949e"/>

            <rect x="220" y="480" width="90" height="14" fill="#79c0ff"/>
            <rect x="318" y="480" width="140" height="14" fill="#8b949e"/>
            <rect x="466" y="480" width="210" height="14" fill="#d2a8ff"/>
        </g>

        <!-- 光标：全图唯一的实心白，也是唯一的竖笔画 -->
        <rect x="220" y="366" width="76" height="14" fill="#ff7b72"/>
        <rect x="304" y="358" width="7" height="30" fill="#ffffff"/>
    </svg>
    <div class="wordmark">Editor</div>
</div>
</body>
</html>
